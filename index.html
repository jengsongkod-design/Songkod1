<style>
:root{
  --red:#C8102E; --red-dark:#9E0C24; --bg:#F3F3F4; --card:#FFFFFF; --ink:#1F2328; --muted:#5F6670; --line:#E3E4E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17181A;--card:#222427;--ink:#F2F2F3;--muted:#A6ABB2;--line:#34373B;--red:#E0213F;--red-dark:#B8182F}
}
:root[data-theme="dark"]{--bg:#17181A;--card:#222427;--ink:#F2F2F3;--muted:#A6ABB2;--line:#34373B;--red:#E0213F;--red-dark:#B8182F}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun","Tahoma",sans-serif;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{background:var(--red);color:#fff;padding:32px 24px 28px;text-align:center}
.logo{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;object-fit:cover;border:3px solid #fff}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.3}
.sub{margin:6px 0 0;font-size:15px;opacity:.92}
.body{padding:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:17px;border-radius:6px}
.btn:hover{background:var(--red-dark)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn svg{width:22px;height:22px;fill:currentColor}
h2{margin:0 0 14px;font-size:18px;font-weight:600}
.btn+.btn{margin-top:12px}
.btn span{flex:1;text-align:left}
.btn.closed{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.btn.closed:hover{background:var(--bg)}
.btn em{font-style:normal;font-size:13px;font-weight:600;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:2px 8px}
</style>
